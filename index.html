<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Группировка в виджет</title>
<meta name="description" content="Итерация 5: прод-доска 8968 и операция «Сгруппировать в виджет»">
<style>
/* Итерация 5 · вход — прод-доска 8968 «Начни утро с обзора рынка» (app.finamx.ru/ideas/8968?vx=477&vy=195&vz=0.10).
   Ноды, связи и тексты сняты с прода 06.10.2026; новое — операция «Сгруппировать в виджет» и сам виджет. Тёмная тема DS WEB FinamX & Limex. */
:root{
  color-scheme:dark;
  --bg:#0a0a0c;            /* фон доски на проде */
  --chrome:#141416;        /* сайдбар прода */
  --banner:#232325;
  --card:#18181b;          /* нода */
  --box:#202024;           /* тело ноды */
  --box2:#26262b;
  --t100:#f2f0ff;
  --t88:rgba(242,240,255,.88);
  --t72:rgba(242,240,255,.72);
  --t56:rgba(242,240,255,.56);
  --t40:rgba(242,240,255,.4);
  --t24:rgba(242,240,255,.24);
  --brand:#9580ff;         /* Brand/Medium */
  --brand-hi:#7055f6;      /* Brand/High */
  --brand-16:rgba(149,128,255,.16);
  --brand-8:rgba(149,128,255,.08);
  --w6:rgba(211,204,255,.08);
  --w8:rgba(211,204,255,.1);
  --w12:rgba(211,204,255,.14);
  --w20:rgba(211,204,255,.2);
  --pop:#222127;
  --ok:#26d962; --er:#f25555; --wa:#ffd684;
  --ink:#0b0a10;
  --font:"Inter","Inter Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t100);font-family:var(--font);font-size:14px;line-height:20px;letter-spacing:-.1px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;letter-spacing:inherit;color:inherit}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}

/* ---------- плашка VPN (как на проде) ---------- */
.vpn{flex-shrink:0;height:37px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--banner);font-size:15px;color:var(--t88)}
.vpn .sp{flex:1}
.vpn button{width:28px;height:28px;border:0;background:none;color:var(--t72);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:4px}
.vpn button:hover{background:var(--w8)}
.main{flex:1;min-height:0;display:flex;position:relative}

/* ---------- сайдбар прода ---------- */
.sb{width:207px;flex-shrink:0;display:flex;flex-direction:column;background:var(--chrome);border-right:1px solid #1f1f22;overflow:hidden;z-index:8}
.sb-top{height:52px;flex-shrink:0;display:flex;align-items:center;padding:4px 0 0 16px}
.sb-top svg{width:88px;height:24px}
.sb-nav{flex:1;min-height:0;overflow:auto;padding:28px 0 8px;scrollbar-width:none}
.sb-it{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 12px 0 16px;border:0;background:none;text-align:left;font-size:15px;color:var(--t88);cursor:pointer;white-space:nowrap}
.sb-it:hover{background:rgba(255,255,255,.04)}
.sb-it .ic{width:20px;height:20px;flex-shrink:0;display:flex;color:var(--t72)}
.sb-it .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sb-sub{position:relative;height:33px;padding-left:48px;font-size:15px;color:var(--t72)}
.sb-sub::before{content:"";position:absolute;left:26px;top:0;bottom:0;border-left:1px solid #3a3a3f}
.sb-sub::after{content:"";position:absolute;left:26px;top:16px;width:12px;border-top:1px solid #3a3a3f}
.sb-sub.last::before{bottom:16px}
.sb-sub.on{background:rgba(149,128,255,.14);color:var(--brand)}
.sb-more{color:var(--t40);font-size:15px}
.sb-more .dots{width:20px;height:20px;border-radius:50%;background:#2a2a2e;display:flex;align-items:center;justify-content:center;color:var(--t56);font-size:11px;letter-spacing:1px}
.sb-bot{flex-shrink:0;padding:8px 0 12px;border-top:1px solid #1f1f22}

/* ---------- доска ---------- */
.bd{position:relative;flex:1;min-width:0;overflow:hidden;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
.bd.panning{cursor:grabbing}
.bd.grab{cursor:grab}
.bd.dots{background-image:radial-gradient(circle at 1px 1px,rgba(242,240,255,.14) 0,rgba(242,240,255,.14) .8px,transparent 1.3px)}
.world{position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0}
.edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.edges path{fill:none;stroke:var(--brand-hi);stroke-opacity:.8;stroke-linecap:round}
.edges path.hl{stroke-opacity:1}
.edges path.hl{stroke:var(--brand)}
.edges circle{fill:var(--bg);stroke:var(--brand-hi)}

/* нода: тип, бейдж-название с цветом слева, справа — тикер и дата; ниже тело */
.n{position:absolute;box-sizing:border-box;border-radius:6px}
.n.hid,.wg.hid{display:none!important}
.n.fly{transition:transform .38s cubic-bezier(.4,0,.2,1),opacity .38s ease;opacity:0}
.n.card{background:var(--card);padding:16px;display:flex;flex-direction:column;gap:12px}
.n .hd{display:flex;align-items:center;gap:8px;height:22px;flex-shrink:0;min-width:0}
.n .bdg{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:2px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.n .hd .sp{flex:1}
.n .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t56);white-space:nowrap}
.n .meta img{width:16px;height:16px;border-radius:50%}
.n .meta .tk{color:var(--t88);font-weight:500}
.n .body{flex:1;min-height:0;background:var(--box);border-radius:4px;position:relative;overflow:hidden}
.n .lo{display:none}
.bd.lod .n.card{background:transparent;padding:0}
.bd.lod .n.card .hd{position:absolute;left:0;top:calc(var(--inv) * -10px);height:auto}
.bd.lod .n.card .hd .bdg{height:calc(var(--inv) * 5px);min-height:8px;width:calc(var(--inv) * 34px);max-width:40%;padding:0;font-size:0}
.bd.lod .n.card .hd .meta{display:none}
.bd.lod .n.card .body{position:absolute;inset:0;background:#1e1e21;border-radius:calc(var(--inv) * 2px)}
.bd.lod .n.card .dt{display:none}
.bd.lod .n.card .lo{display:flex;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:.3em;padding:0 .4em;font-size:var(--lf);line-height:1.2;color:rgba(242,240,255,.72);text-align:center}
.lo .ics{display:flex;align-items:center;gap:.25em;color:rgba(242,240,255,.66)}
.lo .ics svg{width:.82em;height:.82em}
.lo .ics img{width:.9em;height:.9em;border-radius:50%}
.lo .lt{max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}

/* выделение */
.n.sel,.wg.sel{outline:calc(var(--inv) * 2px) solid var(--brand);outline-offset:calc(var(--inv) * 3px)}
.n.shape.sel{outline-offset:0}
.marq{position:absolute;border:1px solid var(--brand);background:rgba(149,128,255,.08);pointer-events:none;z-index:7}

/* фигуры: рамки сегментов — кликаются только по краю */
.n.shape{pointer-events:none;border-radius:0}
.n.shape.fill{pointer-events:auto}
.n.shape .edge{position:absolute;pointer-events:auto}
.n.shape .edge.t{left:0;right:0;top:0;height:max(10px,calc(var(--inv) * 8px))}
.n.shape .edge.b{left:0;right:0;bottom:0;height:max(10px,calc(var(--inv) * 8px))}
.n.shape .edge.l{top:0;bottom:0;left:0;width:max(10px,calc(var(--inv) * 8px))}
.n.shape .edge.r{top:0;bottom:0;right:0;width:max(10px,calc(var(--inv) * 8px))}

/* текст и пояснения */
.n.text{overflow:hidden;font-size:11px;line-height:15px;color:var(--t88);padding:2px 0}
.n.text.col{padding:10px 12px;border-radius:2px;font-size:12px;line-height:16px}
.n.text.hdr{padding:0 10px;display:flex;align-items:center;font-size:12px;line-height:16px;font-weight:500;border-radius:0;letter-spacing:.2px}
.n.text.big{color:var(--t100)}
.md p{margin:0 0 .7em}
.md p:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4{margin:.9em 0 .45em;line-height:1.3;font-weight:600}
.md h1{font-size:1.35em}.md h2{font-size:1.2em}.md h3{font-size:1.06em}
.md>:first-child{margin-top:0}
.md ul{margin:0 0 .7em;padding-left:1.2em}
.md li{margin:.15em 0}
.md table{border-collapse:collapse;margin:0 0 .8em;font-size:.95em;font-variant-numeric:tabular-nums}
.md td,.md th{border:1px solid var(--w12);padding:.25em .5em;text-align:left;vertical-align:top}
.md th{font-weight:600;color:var(--t72)}
.md blockquote{margin:0 0 .7em;padding:.3em .7em;border-left:2px solid var(--w20);color:var(--t72)}
.md hr{border:0;border-top:1px solid var(--w12);margin:.9em 0}
.md pre{margin:0 0 .7em;white-space:pre-wrap;font-family:var(--mono);font-size:.92em;line-height:1.45}
.md code{font-family:var(--mono);font-size:.92em}
.md strong{font-weight:600;color:var(--t100)}
.n.text.col .md strong{color:inherit}

/* тело нод */
.scr{position:absolute;inset:0;overflow:auto;padding:12px 14px;font-size:12px;line-height:17px;color:var(--t88);scrollbar-width:thin;scrollbar-color:var(--w20) transparent;user-select:text;-webkit-user-select:text}
.chart{position:absolute;inset:0}
.chart svg{display:block;width:100%;height:100%}
.chart .px{position:absolute;left:14px;top:12px;font-size:13px;color:var(--t72);font-variant-numeric:tabular-nums}
.chart .px b{font-size:20px;color:var(--t100);font-weight:600;margin-right:8px}
.chart .px .up{color:var(--ok)}.chart .px .dn{color:var(--er)}
.chart .dot{position:absolute;left:10px;bottom:10px;width:10px;height:10px;border-radius:50%;background:#3a3a40}
.rt{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px 14px 14px;gap:10px;font-size:12px}
.rt .lib{align-self:flex-end;color:var(--t56);font-size:11px}
.rt .pr{flex:1;min-height:0;background:#18181b;border-radius:4px;position:relative}
.rt .pr .scr{font-size:11px;line-height:15px;white-space:pre-wrap;color:var(--t72)}
.rt .row{display:flex;align-items:center;justify-content:space-between;color:var(--t56);font-size:11px;height:20px}
.rt .row .v{display:flex;align-items:center;gap:6px;color:var(--t72)}
.tgl{width:24px;height:14px;border-radius:7px;background:#3a3a40;position:relative;flex-shrink:0;border:0;padding:0;cursor:pointer}
.tgl::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#8b8a94;transition:left .15s}
.tgl.on{background:var(--brand-hi)}.tgl.on::after{left:12px;background:#fff}
.rt .run{height:32px;border:0;border-radius:4px;background:var(--brand-hi);color:#fff;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.fund{position:absolute;inset:0;padding:8px 14px;overflow:hidden}
.fund .fr{display:grid;grid-template-columns:1fr 80px 70px;align-items:center;height:38px;border-bottom:1px solid var(--w6);font-size:12px;color:var(--t72);font-variant-numeric:tabular-nums}
.fund .fr .v{text-align:right;color:var(--t88)}
.fund .fr .v.pos{color:var(--ok)}.fund .fr .v.neg{color:var(--er)}
.fund .spk{height:8px;display:flex;gap:2px;align-items:flex-end}
.fund .spk i{width:4px;background:var(--er);opacity:.8}.fund .spk i.g{background:var(--ok)}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--t56);font-size:13px;text-align:center;padding:24px}
.empty svg{color:var(--t40)}
.vid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#25213a,#141418);text-align:center;padding:40px}
.vid .pl{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.vid .vt{font-size:22px;line-height:28px;font-weight:600;max-width:640px}
.vid a{color:var(--brand);font-size:14px}
.chipf{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:12px;background:var(--w8);font-size:12px;color:var(--t88)}

/* ---------- виджет-секция (как секция-нода итерации 4, вариант A): шапка, вход → рутина → результат ---------- */
.wg{position:absolute;width:1100px;box-sizing:border-box;background:#17161f;border:1px solid rgba(211,204,255,.2);border-radius:6px;box-shadow:0 10px 28px rgba(4,4,5,.38);z-index:1000;color:var(--t100)}
.wg.pop{animation:wpop .4s cubic-bezier(.2,.8,.2,1)}
@keyframes wpop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.wg .lo{display:none}
.bd.lod .wg{background:#1e1e21;border-color:var(--brand)}
.bd.lod .wg>.sx{visibility:hidden}
.bd.lod .wg>.lo{display:flex;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:.25em;font-size:var(--lf);line-height:1.2;color:var(--t88);text-align:center}
.wg .lo .st{font-size:.42em;color:var(--t56)}
.sx{position:relative;display:flex;flex-direction:column}
/* шапка секции: Wrapper A20, имя капсом, статус, управление справа */
.sx-hd{display:flex;align-items:center;gap:12px;height:44px;box-sizing:border-box;padding:0 8px 0 12px;border-radius:5px 5px 0 0;background:#3d3a4c;cursor:grab;position:relative;z-index:6}
.sx-hd.open{border-radius:5px 5px 0 0;box-shadow:inset 0 -1px 0 rgba(242,240,255,.08)}
.sx-hd:active{cursor:grabbing}
.sx-ic{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:4px;background:rgba(149,128,255,.24);color:#c9bdff}
.sx-tx{flex:1;min-width:0;display:flex;align-items:baseline;gap:12px;white-space:nowrap;overflow:hidden}
.sx-tx b{font-size:14px;line-height:20px;font-weight:600;text-transform:uppercase;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;outline:0;border-radius:2px}
.sx-tx b[contenteditable="true"]{box-shadow:0 0 0 1px var(--brand);text-transform:none;cursor:text}
.sx-st{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--t72);overflow:hidden;text-overflow:ellipsis}
.sx-st .ok{color:var(--ok);display:flex}.sx-st .er{color:var(--er);display:flex}.sx-st .ld{color:var(--brand);display:flex}
.sx-st.live{color:var(--brand)}
.sx-ct{display:flex;align-items:center;gap:2px;flex-shrink:0}
.hi{position:relative;width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:2px;background:none;color:var(--t72);cursor:pointer;transition:background .15s,color .15s}
.hi:hover{background:rgba(211,204,255,.14);color:var(--t100)}
.hi.on{background:rgba(149,128,255,.24);color:var(--t100)}
.hi[disabled]{opacity:.3;cursor:default;background:none}
.hi svg{display:block}
.hi[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:0;white-space:nowrap;padding:4px 8px;border-radius:4px;background:#2c2b33;color:var(--t100);font-size:11px;line-height:14px;z-index:5;pointer-events:none}
.sx-prog{position:relative;height:2px;background:transparent}
.sx-prog i{position:absolute;left:0;top:0;height:2px;width:0;background:var(--brand);transition:width .3s linear}
/* шестерёнка: все настройки — в самой секции, под шапкой */
.sx-set{position:absolute;left:0;right:0;top:44px;z-index:5;max-height:calc(100% - 44px);overflow:auto;box-sizing:border-box;padding:12px 16px 18px;background:#3d3a4c;border-radius:0 0 6px 6px;box-shadow:0 18px 32px rgba(4,4,5,.55),0 2px 0 rgba(4,4,5,.25);scrollbar-width:thin;scrollbar-color:rgba(242,240,255,.24) transparent}
.sx-set.anim{animation:setdown .28s cubic-bezier(.2,.8,.2,1)}
@keyframes setdown{from{clip-path:inset(0 0 100% 0);transform:translateY(-6px)}to{clip-path:inset(0 0 0 0);transform:none}}
.sx-set .ttl{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:10px;line-height:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t100)}
.sx-set .ttl .sp{flex:1}
.sx-set .ttl .hi{width:24px;height:24px}
.sx-set .kv .k{color:rgba(242,240,255,.68)}
.sx-set .ptx{background:rgba(11,10,16,.35)}
.sx-set .tag,.sx-set .sel-b{background:rgba(11,10,16,.28);border-color:rgba(242,240,255,.12)}
.sx-set .tgl{background:rgba(11,10,16,.45)}
.sx-set .tgl.on{background:var(--brand-hi)}
.sx-set .lnk{color:#b9a9ff}
.sx-set .lnk.mut{color:rgba(242,240,255,.6)}
.sx-veil{position:absolute;left:0;right:0;top:44px;bottom:0;z-index:4;background:rgba(11,10,16,.45);border-radius:0 0 6px 6px}
.sx-veil.anim{animation:veil .28s ease}
@keyframes veil{from{opacity:0}}
.kv{display:grid;grid-template-columns:200px 1fr;gap:10px 16px;align-items:start;font-size:12px;line-height:18px}
.kv .k{color:var(--t56);padding-top:3px}
.kv .v{color:var(--t88);min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ptx{width:100%;background:var(--box);border-radius:4px;padding:8px 10px;font-size:11px;line-height:16px;color:var(--t72);white-space:pre-wrap;max-height:48px;overflow:hidden;box-sizing:border-box;font-family:var(--font)}
.ptx.open{max-height:260px;overflow:auto;scrollbar-width:thin}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:2px;background:var(--w8);font-size:11px;color:var(--t88)}
.tag img{width:14px;height:14px;border-radius:50%}
.sel-b{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 6px 0 8px;border:1px solid var(--w8);border-radius:2px;background:var(--box);font-size:12px;color:var(--t88);cursor:pointer}
.sel-b:hover{border-color:var(--w20)}
/* колонки */
.sx-g{display:grid;grid-template-columns:300px 300px minmax(0,1fr);align-items:stretch}
.sx-col{position:relative;display:flex;flex-direction:column;min-width:0}
.sx-col+.sx-col{border-left:1px solid var(--w6)}
.snh{position:relative;display:flex;align-items:center;gap:8px;min-width:0;height:40px;box-sizing:border-box;padding:0 8px 0 12px;border-bottom:1px solid var(--w6)}
.hc-l{display:flex;align-items:baseline;gap:6px;min-width:0;font-size:10px;line-height:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t72);white-space:nowrap}
.hc-l i{font-style:normal;font-weight:500;letter-spacing:0;color:var(--t56);font-variant-numeric:tabular-nums}
.hc-pk{display:inline-flex;align-items:center;gap:4px;height:24px;margin-left:-4px;padding:0 4px;border:0;border-radius:2px;background:none;cursor:pointer}
.hc-pk:hover{background:var(--w8)}
.hc-pk svg{display:block;color:var(--t56)}
.hc-sp{flex:1;min-width:0}
.stepn{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(149,128,255,.16);color:var(--brand);font-size:11px;line-height:12px;font-weight:600;font-variant-numeric:tabular-nums}
.arw{position:absolute;left:-12px;top:50%;margin-top:-11px;width:22px;height:22px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#17161f;border:1px solid rgba(211,204,255,.28);color:var(--brand);z-index:2}
.arw svg{display:block}
.arw.live{background:var(--brand);border-color:var(--brand);color:#17161f;animation:arwp 1.1s ease-in-out infinite}
@keyframes arwp{50%{box-shadow:0 0 0 5px rgba(149,128,255,.18)}}
.hb{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:24px;box-sizing:border-box;padding:0 8px;border:0;border-radius:2px;background:var(--w8);font-size:12px;line-height:16px;font-weight:500;color:var(--t100);white-space:nowrap;cursor:pointer}
.hb:hover{background:var(--w12)}
.hb svg{display:block}
.sx-b{position:relative;flex:1;min-height:380px;display:flex;flex-direction:column}
/* вход: строки тикеров */
.in-r{position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;box-sizing:border-box;border-top:1px solid var(--w6);cursor:pointer;transition:background .15s}
.in-r:first-child{border-top:0}
.in-r:hover{background:rgba(211,204,255,.05)}
.in-r.new{box-shadow:inset 2px 0 0 var(--brand)}
.tk-lw{position:relative;width:24px;height:24px;border-radius:50%;overflow:hidden;flex-shrink:0}
.tk-lw::after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.12);border-radius:50%}
.tk-lw img{display:block;width:24px;height:24px}
.tk-lw.ph{display:flex;align-items:center;justify-content:center;background:rgba(211,204,255,.16);font-size:9px;line-height:10px;font-weight:600;color:var(--t100)}
.in-n{flex:1;min-width:0;display:flex;flex-direction:column}
.in-n b{font-size:12px;line-height:16px;font-weight:600;color:var(--t100)}
.in-n b i{font-style:normal;font-weight:400;color:var(--t56);margin-left:4px}
.in-n span{font-size:11px;line-height:14px;color:var(--t56);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in-p{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;line-height:16px;color:var(--t100);font-variant-numeric:tabular-nums}
.in-p span{font-size:11px;line-height:14px}
.in-p .up{color:var(--ok)}.in-p .dn{color:var(--er)}
.in-x{display:none;gap:2px}
.in-r:hover .in-x{display:flex}
.in-r:hover .in-p{display:none}
.in-x .hi{width:24px;height:24px}
.sx-more{padding:10px 12px;font-size:11px;line-height:16px;color:var(--t56);border-top:1px solid var(--w6)}
.sx-more .lnk{padding:0;font-size:11px}
/* рутина */
.pr{display:flex;flex-direction:column;gap:12px;padding:12px;flex:1}
.pr-st{display:flex;align-items:center;gap:6px;min-height:18px;font-size:12px;line-height:16px;color:var(--t88)}
.pr-st .sp{flex:1}
.pr-st .ok{color:var(--ok);display:flex}.pr-st .er{color:var(--er);display:flex}.pr-st .ld{color:var(--brand);display:flex}
.pr-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pr-lg{display:flex;align-items:center}
.pr-lg button{width:22px;height:22px;margin-right:-4px;padding:0;border:2px solid #17161f;border-radius:50%;background:#2a2930;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:600;color:var(--t100)}
.pr-lg button img{width:18px;height:18px;border-radius:50%;display:block}
.pr-lg button:hover{z-index:2;transform:scale(1.25);border-color:var(--brand)}
.pr-lg button.run{border-color:var(--brand)}
.pr-lg button.done::after{content:"";position:absolute;right:-3px;bottom:-3px;width:8px;height:8px;border-radius:50%;background:var(--ok);border:1.5px solid #17161f}
.pr-n{font-size:11px;line-height:14px;color:var(--t56);margin-left:8px}
.pr-out{font-size:11px;line-height:16px;color:var(--t56);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pr-out .tag{height:20px}
.pr-sp{flex:1}
.lnk{border:0;background:none;padding:2px 4px;border-radius:2px;color:var(--brand);font-size:12px;line-height:16px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.lnk:hover{background:var(--brand-8)}
.lnk.mut{color:var(--t56)}
.snr{padding:12px;border-top:1px solid var(--w6)}
.split{display:flex;height:36px;border-radius:2px;overflow:hidden}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:36px;box-sizing:border-box;padding:0 12px;border:0;border-radius:2px;font-size:13px;line-height:18px;font-weight:600;cursor:pointer;white-space:nowrap;background:var(--t100);color:#261f48;transition:background .15s}
.btn:hover{background:#fff}
.btn svg{display:block;flex-shrink:0}
.split .btn{flex:1;border-radius:0}
.split .dd{flex:0 0 40px;border-left:1px solid rgba(38,31,72,.18)}
.btn.sec{background:var(--w8);color:var(--t100)}
.btn.sec:hover{background:var(--w12)}
.btn.stop{background:rgba(242,85,85,.16);color:#ffb3b3;width:100%}
.btn.stop:hover{background:rgba(242,85,85,.24)}
.btn.brand{background:var(--brand-hi);color:#fff}
.btn.brand:hover{background:#7c63ff}
.btn.sm{height:28px;font-size:12px;padding:0 10px}
.ro-empty{padding:16px 12px;font-size:12px;line-height:17px;color:var(--t56)}
/* результат */
.rs{position:relative;flex:1;min-height:0}
.rs .scr{position:absolute;inset:0;padding:12px 16px 16px;font-size:13px;line-height:19px;color:var(--t88)}
.rs-k{font-size:10px;line-height:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t56);margin-bottom:4px}
.rs-note{font-size:11px;line-height:15px;color:var(--t40);margin:-2px 0 8px}
.rep h4{margin:0 0 8px;font-size:16px;line-height:22px;font-weight:600;color:var(--t100)}
.rep .nt{margin:0 0 10px;padding:6px 10px;border-left:2px solid var(--wa);color:var(--t72);font-size:12px;line-height:17px}
.rep h5{margin:12px 0 4px;font-size:13px;font-weight:600;color:var(--t100)}
.rep ul{margin:0;padding-left:18px}
.rep li{margin:3px 0}
.rep table{border-collapse:collapse;font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums}
.rep td{border:1px solid var(--w12);padding:3px 8px}
.rs .empty{position:absolute;inset:0}
.hist{display:flex;flex-direction:column}
.h-row{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:4px;font-size:12px;line-height:16px;cursor:pointer;border:0;background:none;text-align:left;width:100%;color:var(--t88)}
.h-row:hover{background:var(--w6)}
.h-row .ic{display:flex;color:var(--ok)}
.h-row .ic.er{color:var(--er)}
.h-row .t{display:flex;flex-direction:column;gap:1px;min-width:0}
.h-row .t b{font-weight:500;color:var(--t100)}
.h-row .t span{color:var(--t56)}
.h-row .d{color:var(--t56);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:4px}
.h-row.cur{background:var(--brand-8)}
.h-sub{padding:0 8px 6px 38px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:11.5px;line-height:18px;color:var(--t72);font-variant-numeric:tabular-nums}
.h-sub button{border:0;background:none;padding:0;text-align:left;color:var(--t88);cursor:pointer;font-size:inherit}
.h-sub button:hover{color:var(--brand)}
.h-sub .d{color:var(--t56);text-align:right}
.h-day{font-size:10px;letter-spacing:.08em;font-weight:600;text-transform:uppercase;color:var(--t40);padding:10px 8px 4px}
/* сборка: каркас секции, пока в неё складываются ноды */
.wg.forming{background:rgba(23,22,31,.94);border-style:dashed;border-color:var(--brand)}
.wg.forming .sx-b>*,.wg.forming .sx-set,.wg.forming .snh>*:not(.hc-l):not(.arw):not(.hc-pk):not(.stepn),.wg.forming .sx-ct,.wg.forming .sx-st{opacity:0}
.wg.forming .sx-col{background:rgba(149,128,255,.05)}
.wg .sx-b>*,.wg .sx-ct,.wg .sx-st{transition:opacity .35s ease}
.n.blink::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--brand);opacity:0;pointer-events:none;animation:blink .8s ease-in-out}
.n.shape.blink::after{display:none}
.n.shape.blink{animation:blinkf .8s ease-in-out}
@keyframes blink{0%,100%{opacity:0}15%,55%{opacity:.38}35%,75%{opacity:.06}}
@keyframes blinkf{0%,100%{opacity:1}25%,65%{opacity:.35}45%{opacity:1}}
.n.fade{transition:opacity .3s ease}
.n.fly2{transition:transform .75s cubic-bezier(.55,0,.25,1),opacity .75s ease-in;z-index:1200!important}
.n.ping{outline:calc(var(--inv) * 3px) solid var(--brand);outline-offset:calc(var(--inv) * 4px);animation:ping 1.4s ease-out 2}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(149,128,255,.6)}100%{box-shadow:0 0 0 calc(var(--inv) * 28px) rgba(149,128,255,0)}}
.bd.focusing .n:not(.ping):not(.shape){opacity:.35;transition:opacity .3s}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--t56);font-size:13px;text-align:center;padding:24px}

/* меню */
.menu{position:absolute;z-index:40;min-width:240px;max-width:360px;max-height:420px;overflow:auto;padding:6px;background:var(--pop);border:1px solid var(--w12);border-radius:6px;box-shadow:0 16px 40px rgba(0,0,0,.5);font-size:13px;scrollbar-width:thin}
.menu .mh{padding:6px 10px 4px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--t40)}
.menu .mi{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:6px 10px;border:0;border-radius:4px;background:none;text-align:left;color:var(--t100);cursor:pointer;font-size:13px;line-height:18px}
.menu .mi:hover,.menu .mi.f{background:var(--w8)}
.menu .mi .ic{display:flex;color:var(--t72);flex-shrink:0}
.menu .mi img,.menu .mi .av{width:20px;height:20px;border-radius:50%;flex-shrink:0}
.menu .mi .av{display:flex;align-items:center;justify-content:center;background:#34333b;font-size:9px;font-weight:600}
.menu .mi .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.menu .mi .tx small{color:var(--t56);font-size:11.5px;line-height:15px}
.menu .mi .kb{color:var(--t40);font-size:12px}
.menu .mi.on .ck{color:var(--brand)}
.menu .ms{height:1px;background:var(--w8);margin:5px 4px}
.menu input{width:100%;box-sizing:border-box;height:32px;margin:0 0 6px;padding:0 10px;border:1px solid var(--w12);border-radius:4px;background:var(--box);color:var(--t100);font-size:13px;outline:0}
.menu input:focus{border-color:var(--brand)}

/* раскрытый виджет: пунктирная рамка группы и плавающая панель */
.xbar{position:absolute;left:50%;top:60px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:10px;height:40px;box-sizing:border-box;padding:0 6px 0 10px;background:var(--pop);border:1px solid var(--brand);border-radius:6px;box-shadow:0 12px 32px rgba(0,0,0,.45);white-space:nowrap;font-size:13px;color:var(--t72)}
.xbar b{color:var(--t100);font-weight:600}
.xbar .xi{display:flex;color:var(--brand)}
.gfr{position:absolute;border:calc(var(--inv) * 2px) dashed var(--brand);border-radius:calc(var(--inv) * 8px);pointer-events:none;z-index:900}
.gfr .gh{position:absolute;left:-2px;bottom:100%;margin-bottom:calc(var(--inv) * 6px);transform-origin:0 100%;transform:scale(var(--inv));display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;background:var(--pop);border:1px solid var(--brand);border-radius:6px;pointer-events:auto;white-space:nowrap;font-size:13px}
.gfr .gh b{font-weight:600}
.gfr .gh span{color:var(--t56);font-size:12px}

/* шапка доски, «Поделиться», подсказка, тост */
.bd-title{position:absolute;left:16px;top:16px;z-index:6;height:34px;display:flex;align-items:center;padding:0 12px;background:#1c1c1f;border-radius:2px;font-size:15px;color:var(--t100)}
.tr{position:absolute;right:13px;top:13px;z-index:6;display:flex;gap:8px;align-items:center}
.grp{height:32px;display:flex;align-items:center;gap:8px;padding:0 12px;border:0;border-radius:2px;background:#1c1c1f;color:var(--t56);font-size:14px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.grp:hover{background:#26262a;color:var(--t88)}
.grp.on{background:var(--brand-hi);color:#fff}
.grp.on:hover{background:#7c63ff}
.grp .cnt{min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:rgba(255,255,255,.22);font-size:12px;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
.grp.pulse{animation:grpp .9s ease-out 2}
@keyframes grpp{0%{box-shadow:0 0 0 0 rgba(149,128,255,.7)}100%{box-shadow:0 0 0 10px rgba(149,128,255,0)}}
.share{position:relative;height:32px;display:flex;align-items:center;gap:8px;padding:0 12px;border:0;border-radius:2px;background:#1c1c1f;color:var(--t100);font-size:14px;cursor:pointer}
.share:hover{background:#26262a}
.sh-b{position:absolute;right:-6px;top:-8px;min-width:16px;height:16px;border-radius:8px;background:var(--er);color:#fff;font-size:11px;line-height:16px;text-align:center}
.hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:12px;max-width:calc(100% - 140px);padding:8px 8px 8px 14px;background:var(--pop);border:1px solid var(--w12);border-radius:6px;box-shadow:0 12px 32px rgba(0,0,0,.45);font-size:13px;line-height:18px;color:var(--t88)}
.hint .pt{flex-shrink:0;font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--brand);border:1px solid rgba(149,128,255,.5);border-radius:2px;padding:1px 5px}
.hint .tx{min-width:0}
.hint kbd,.snack kbd{font-family:var(--font);font-size:11px;padding:1px 5px;border-radius:3px;background:var(--w12);color:var(--t100)}
.hint .ib{width:28px;height:28px}
.snack{position:absolute;left:50%;bottom:24px;transform:translate(-50%,8px);z-index:45;opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;max-width:calc(100% - 140px);padding:10px 14px;border-radius:6px;background:#2a2930;border:1px solid var(--w12);font-size:13px;color:var(--t100);transition:opacity .18s,transform .18s}
.snack.on{opacity:1;transform:translate(-50%,0)}
.snack .ok{color:var(--ok);display:flex}

/* тулбар справа (DS) */
.tools{position:absolute;top:0;bottom:0;right:0;width:68px;box-sizing:border-box;padding:12px 12px 12px 8px;display:flex;align-items:center;justify-content:center;z-index:6;pointer-events:none}
.tb{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(34,33,44,.8);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);border-radius:2px}
.tb-g{display:flex;flex-direction:column;gap:2px}
.tbb{position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:2px;background:none;color:var(--t100);cursor:pointer}
.tbb:hover{background:var(--w8)}
.tbb>svg{display:block}
.tbb .mk{position:absolute;left:0;bottom:0;display:flex;color:var(--t56)}
.tb-dv{width:20px;height:1px;background:var(--w8)}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

</head>

'87936': `Вот **топ-10 самых ликвидных акций** на Московской бирже (MOEX) по среднедневному объёму торгов — это так называемые «голубые фишки», формирующие основу российского фондового рынка:

'87942': `Подготовь утренний обзор по бумаге для инвесторов.

- Рассчитай индикатор RSI по бумаге по последним 14 дням. Для расчета используй только доступный инструмент "Расчёт индикатора"
- RSI (14): зона перекупленности/перепроданности
- Ближайшие уровни поддержки и сопротивления

### 6. 🔑 На что обратить внимание сегодня

Формат: компактный, с цифрами, без воды.

DIG: { title: 'Утренний дайджест рынка — 11.09.2026', note: 'В контекст поступили обзоры только по 7 из 10 заявленных бумаг (SBER, GAZP, LKOH, VTBR, NVTK, TATN, MGNT). Данные по ROSN, GMKN, PLZL отсутствуют — сектор металлов/добычи и часть нефтегазового сегмента не могут быть оценены полноценно.', secs: [
 { h: 'Пульс рынка', it: [['', 'Сессия проходит в смешанной, местами слабой динамике: широкой синхронной поддержки по всему списку нет. Из 7 доступных бумаг 4 выглядят слабыми на текущем фоне (VTBR, MGNT, GAZP — коррекция после вчерашнего роста, NVTK — снижение к закрытию); SBER, LKOH и TATN держатся относительно лучше. Это скорее перестройка после новостных движений, чем единый импульс: банки и нефтегаз чувствительны к макрофону, ритейл заметно отстаёт.'], ['Вердикт:', ' рынок чувствует себя неровно — точечная сила есть, но общий тон ближе к осторожному.']] },
 { h: 'Лидеры и аутсайдеры', it: [['Лучшие:', ' GAZP +5,30% (закрытие у максимума дня, объём подтверждён, драйвер — корпоративная повестка/ВОСА); SBER +2,89% (рост на повышенном объёме, устойчивость после решения ЦБ); LKOH +2,43% (опередил индекс, драйверы — добыча/дивидендные ожидания).'], ['Худшие:', ' MGNT -3,14% внутри дня (падение втрое быстрее IMOEX, специфично для бумаги — убыток за 1П2026); VTBR -0,70% (слабее рынка, без аномального объёма); NVTK -0,77% к закрытию (откат после сильного роста).'], ['Аномальные движения (>±3%):', ' GAZP +5,30%, MGNT -3,14%.']] },
 { h: 'Секторальная картина', it: ['Нефтегаз (GAZP, LKOH, TATN, NVTK): в целом сильнее рынка, но без единой траектории — GAZP на новостях по ВОСА, LKOH на дивидендных ожиданиях, TATN на нейтральном фоне с откатом, NVTK на СПГ-повестке с краткосрочной коррекцией.', 'Финансы (SBER, VTBR): SBER удерживает относительную силу после решения ЦБ, VTBR слабее и ниже ключевых средних.', 'Металлы и добыча (GMKN, PLZL): данных в обзорах нет, оценка сектора невозможна.', 'Ритейл (MGNT): негативная картина — бумага резко отстаёт от индекса на фоне убытка за 1П2026 и слабой техники.'] },
 { h: 'Главные темы дня', it: [['', '1. Решение ЦБ по ставке — переоценка по SBER, LKOH, VTBR, TATN, MGNT; SBER держится лучше, часть бумаг корректируется после вчерашних ростов.'], ['', '2. Корпоративные собрания и дивидендная повестка — GAZP (отмена ВОСА, волатильность статуса), NVTK и TATN (дивидендные ожидания), LKOH и VTBR (дивидендная тема в фокусе).'], ['', '3. Отчётность — SBER (высокая прибыльность и рентабельность), VTBR и MGNT (слабый денежный поток/убыток), TATN и NVTK (сильные операционные метрики).'], ['', '4. Газовая/СПГ-повестка — GAZP (инфраструктурные проекты), NVTK (отгрузки, «Арктик СПГ-2»).'], ['', '5. Слабость потребительского сегмента — MGNT под давлением на фоне убытка и снижения маржи.']] },
 { h: 'Макроконтекст', it: [['', 'Фон завязан прежде всего на реакцию рынка на решение ЦБ РФ по ставке — это заметно в SBER и VTBR. IMOEX сам под давлением в текущей сессии, что объясняет синхронную слабость части бумаг. Нефтегазовый фон поддерживает GAZP, LKOH, TATN, NVTK; корпоративные новости и дивидендные ожидания дают отдельные импульсы; рублёвая/инфляционная повестка на ближайшие дни — фактор для MGNT и банков. По геополитике — только общие упоминания санкционных рисков без конкретики.']] },
 { h: 'Техническая сводка', it: [['', 'IMOEX после вчерашнего роста сегодня слабее — режим осторожный. Выше своих долгосрочных средних: SBER, LKOH, TATN, NVTK. Ниже: GAZP, VTBR, MGNT. По RSI: перекупленность — LKOH, TATN; нейтральная зона — SBER, GAZP, VTBR, NVTK, MGNT; перепроданности не выявлено. Итог: технически смешанно, локальная сила без широкого подтверждения.']] },
 { h: 'Дивидендный календарь', it: [['GAZP:', ' доходность 26,15%, ключевая тема — статус ВОСА, не выплаты.'], ['SBER:', ' доходность 10,49%, дат по отсечке не найдено.'], ['LKOH:', ' доходность 7,71%, обсуждаются промежуточные дивиденды без формального решения.'], ['TATN:', ' рыночные оценки выплаты за 2026 год до ~68 ₽/акцию.'], ['NVTK:', ' доходность 4,52%, сообщения о дивидендах и ВОСА.'], ['VTBR:', ' ориентир менеджмента 25–50% от чистой прибыли за 2026 год; последняя фактическая выплата — 9,71 ₽/акцию за 2025 год.'], ['MGNT:', ' за 2025 год выплат не было; последняя — 412,13 ₽/акцию за 2023 год.']] },
 { h: 'На что обратить внимание сегодня', it: ['Реакция рынка на решение ЦБ — главный драйвер для SBER и VTBR, косвенно для всего рынка.', 'Статус ВОСА GAZP остаётся ключевой темой.', 'Дивидендные ожидания LKOH и TATN — фактор интереса к нефтегазу.', 'СПГ-новости NVTK — позитивный фон, но после сильного роста возможна пауза.', 'MGNT — ключевой риск дня: слабость сохраняется на фоне отрицательного фундаментального и технического фона.', 'Пробел данных: по ROSN, GMKN, PLZL информации в обзорах нет.'] },

    toast(m.tk + ' → ' + tk + ' · запусти виджет, чтобы обновить результат');
  } else {
    if (w.tick.indexOf(tk) >= 0) { if (w.tick.length <= 1) return toast('Нужен хотя бы один тикер'); w.tick = w.tick.filter((t) => t !== tk); w.changed = true; renderW(w); return toast(tk + ' убран из виджета'); }
    w.tick.push(tk); w.added.push(tk); w.changed = true; renderW(w);
    toast(tk + ' добавлен · при запуске появится мини-обзор по тому же промту');

}
function startRename(w) {
  const nm = $('.sx-nm', w.el); nm.contentEditable = 'true'; nm.focus();

// ---------- выделение ----------
const sel = new Set();
const grpBtn = $('#grp'), grpCnt = $('#grpc');
function setSel(ids) {
  sel.forEach((id) => { const el = N[id] ? N[id].el : Wd[id] && Wd[id].el; if (el) el.classList.remove('sel'); });
  sel.clear(); ids.forEach((id) => sel.add(id));
  sel.forEach((id) => { const el = N[id] ? N[id].el : Wd[id] && Wd[id].el; if (el) el.classList.add('sel'); });
  drawEdges(); updateGrp();
}
function updateGrp() {
  const n = [...sel].filter((id) => N[id]).length;
  grpBtn.classList.toggle('on', n >= 2); grpBtn.setAttribute('aria-disabled', n >= 2 ? 'false' : 'true');
  grpCnt.hidden = n < 2; grpCnt.textContent = n;
  grpBtn.title = n >= 2 ? 'Собрать ' + cnt(n, 'выделенный элемент', 'выделенных элемента', 'выделенных элементов') + ' в виджет · ⌘G' : 'Выдели элементы: потяни рамкой по доске или ⌘A';
}
function pulseGrp() { grpBtn.classList.remove('pulse'); void grpBtn.offsetWidth; grpBtn.classList.add('pulse'); }
const isFrame = (n) => n && n.t === 'shape' && n.border !== 'transparent';
// рамка сегмента берёт с собой всё, что внутри неё
function withFrames(ids) {
  const s = new Set(ids);
  ids.forEach((id) => { const f = N[id]; if (!isFrame(f)) return; ORDER.forEach((o) => { if (o === id || !visible(o) || isFrame(N[o])) return; const q = N[o], cx = q.x + q.w / 2, cy = q.y + q.h / 2; if (cx >= f.x && cy >= f.y && cx <= f.x + f.w && cy <= f.y + f.h) s.add(o); }); });
  return [...s];
}
function selectAll() { setSel(ORDER.filter((id) => visible(id)).concat(Object.keys(Wd).filter(visible))); }

// ---------- указатель: рамка выделения, перенос, панорама ----------
let drag = null, spaceDown = false;
const marq = $('#marq');
const UI_SEL = '.menu,.tools,.bd-title,.tr,.snack,.xbar';
bd.addEventListener('pointerdown', (e) => {
  if (busy) return;
  if (e.target.closest(UI_SEL)) return;
  if (!menuEl.hidden) closeMenu();
  const p0 = { x: e.clientX, y: e.clientY };
  if (e.button === 1 || (e.button === 0 && spaceDown)) { e.preventDefault(); drag = { kind: 'pan', p0, last: p0, moved: true }; bd.classList.add('panning'); bd.setPointerCapture(e.pointerId); return; }
  if (e.button !== 0) return;
  const wEl = e.target.closest('.wg'), nEl = e.target.closest('.n');
  if (wEl && e.target.closest('button,input,a,[contenteditable="true"],[data-act]')) return;
  if (wEl && e.target.closest('.rs,.ptx,.sx-set,.sx-veil')) { if (!sel.has(wEl.dataset.wid)) setSel([wEl.dataset.wid]); return; }
  if (nEl && e.target.closest('button,a')) return;
  if (nEl && e.target.closest('.scr') && sel.has(nEl.dataset.id) && !e.shiftKey) return;
  const id = wEl ? wEl.dataset.wid : nEl ? nEl.dataset.id : null;
  if (!id) drag = { kind: 'marq', p0, w0: toWorld(e.clientX, e.clientY), cur: p0, add: e.shiftKey || e.metaKey || e.ctrlKey, moved: false };
  else if (e.shiftKey || e.metaKey || e.ctrlKey) drag = { kind: 'pend', p0, id };
  else { if (!sel.has(id)) setSel(N[id] ? withFrames([id]) : [id]); drag = { kind: 'move', p0, ids: [...sel], moved: false, last: p0 }; }
  bd.setPointerCapture(e.pointerId);
});
function marqDraw() {
  const d = drag, b = bd.getBoundingClientRect();
  const sx = V.x + d.w0.x * V.z, sy = V.y + d.w0.y * V.z, cx = d.cur.x - b.left, cy = d.cur.y - b.top;
  marq.hidden = false; marq.style.cssText = 'left:' + Math.min(sx, cx) + 'px;top:' + Math.min(sy, cy) + 'px;width:' + Math.abs(cx - sx) + 'px;height:' + Math.abs(cy - sy) + 'px';
}
function autoPan() {
  if (!drag || drag.kind !== 'marq') return;
  const b = bd.getBoundingClientRect(), m = 48, c = drag.cur; let vx = 0, vy = 0;
  if (c.x < b.left + m) vx = (b.left + m - c.x) / 3; else if (c.x > b.right - 72 - m) vx = -(c.x - (b.right - 72 - m)) / 3;
  if (c.y < b.top + m) vy = (b.top + m - c.y) / 3; else if (c.y > b.bottom - m) vy = -(c.y - (b.bottom - m)) / 3;
  if (vx || vy) { V.x += Math.max(-24, Math.min(24, vx)); V.y += Math.max(-24, Math.min(24, vy)); apply(); marqDraw(); }
  drag.raf = requestAnimationFrame(autoPan);
}
bd.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.p0.x, dy = e.clientY - drag.p0.y;
  if (drag.kind === 'pend') { if (Math.hypot(dx, dy) < 5) return; drag = { kind: 'marq', p0: drag.p0, w0: toWorld(drag.p0.x, drag.p0.y), cur: drag.p0, add: true, moved: false }; }
  if (drag.kind === 'pan') { V.x += e.clientX - drag.last.x; V.y += e.clientY - drag.last.y; drag.last = { x: e.clientX, y: e.clientY }; apply(); }
  else if (drag.kind === 'marq') {
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    if (!drag.moved) { drag.moved = true; drag.raf = requestAnimationFrame(autoPan); }
    drag.cur = { x: e.clientX, y: e.clientY }; marqDraw();
  } else if (drag.kind === 'move') {
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    drag.moved = true;
    const mx = (e.clientX - drag.last.x) / V.z, my = (e.clientY - drag.last.y) / V.z; drag.last = { x: e.clientX, y: e.clientY };
    drag.ids.forEach((id) => {
      if (Wd[id]) { const w = Wd[id]; w.x += mx; w.y += my; w.el.style.left = w.x + 'px'; w.el.style.top = w.y + 'px'; }
      else if (N[id]) { const n = N[id]; n.x += mx; n.y += my; n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px'; }
    });
    Object.values(Wd).forEach((w) => { if (w.expanded && w.fr && drag.ids.some((id) => w.ids.includes(id))) frameFor(w); });
    drawEdges();
  }
});
function marqHit(r) {
  const hits = [];
  ORDER.forEach((id) => {
    if (!visible(id)) return; const q = N[id];
    const inter = q.x < r.x2 && q.x + q.w > r.x1 && q.y < r.y2 && q.y + q.h > r.y1;
    if (!inter) return;
    if (isFrame(q)) { const inside = q.x >= r.x1 && q.y >= r.y1 && q.x + q.w <= r.x2 && q.y + q.h <= r.y2; if (inside || r.y1 <= q.y + 60) hits.push(id); }
    else hits.push(id);
  });
  Object.keys(Wd).forEach((id) => { if (!visible(id)) return; const q = rectOf(id); if (q.x < r.x2 && q.x + q.w > r.x1 && q.y < r.y2 && q.y + q.h > r.y1) hits.push(id); });
  return withFrames(hits);
}
const endDrag = () => {
  if (!drag) return;
  const d = drag; drag = null; bd.classList.remove('panning'); if (d.raf) cancelAnimationFrame(d.raf);
  if (d.kind === 'pend') { const s = new Set(sel); const add = N[d.id] ? withFrames([d.id]) : [d.id]; if (s.has(d.id)) add.forEach((i) => s.delete(i)); else add.forEach((i) => s.add(i)); setSel([...s]); }
  if (d.kind === 'marq') {
    marq.hidden = true;
    if (!d.moved) { if (!d.add) setSel([]); return; }
    const b = toWorld(d.cur.x, d.cur.y), a = d.w0;
    const hit = marqHit({ x1: Math.min(a.x, b.x), y1: Math.min(a.y, b.y), x2: Math.max(a.x, b.x), y2: Math.max(a.y, b.y) });
    setSel(d.add ? [...new Set([...sel, ...hit])] : hit);
    if (hit.filter((id) => N[id]).length >= 2) pulseGrp();
  }

bd.addEventListener('pointerup', endDrag);
bd.addEventListener('pointercancel', endDrag);
bd.addEventListener('wheel', (e) => {
  if (e.target.closest('.menu')) return;
  const scr = e.target.closest('.scr,.ptx.open');
  if (scr && !e.ctrlKey && !e.metaKey && scr.scrollHeight > scr.clientHeight + 2) {
    const nEl = scr.closest('.n'); const ok = scr.closest('.wg') || (nEl && sel.has(nEl.dataset.id));
    const atEnd = (e.deltaY > 0 && scr.scrollTop + scr.clientHeight >= scr.scrollHeight - 1) || (e.deltaY < 0 && scr.scrollTop <= 0);
    if (ok && !atEnd) return;
  }
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.004)));
  else { V.x -= e.deltaX * (e.deltaMode ? 30 : 1); V.y -= e.deltaY * (e.deltaMode ? 30 : 1); apply(); }
}, { passive: false });
bd.addEventListener('dblclick', (e) => {
  const nm = e.target.closest('.sx-nm'); if (nm) { const w = Wd[nm.closest('.wg').dataset.wid]; return startRename(w); }
  if (e.target.closest('.n,.wg,' + UI_SEL)) return;
  fitAll();
});
bd.addEventListener('contextmenu', (e) => {
  if (e.target.closest(UI_SEL)) return;
  e.preventDefault(); if (busy) return;
  const wEl = e.target.closest('.wg'), nEl = e.target.closest('.n');
  const id = wEl ? wEl.dataset.wid : nEl ? nEl.dataset.id : null;
  if (id && !sel.has(id)) setSel(N[id] ? withFrames([id]) : [id]);
  ctxMenu(e);
});

// клики по управлению
bd.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b || busy) return;
  const a = b.dataset.act;
  const wEl = b.closest('.wg'); const w = wEl ? Wd[wEl.dataset.wid] : b.dataset.wid ? Wd[b.dataset.wid] : null;
  switch (a) {
    case 'gear': w.gear = !w.gear; w._gearAnim = w.gear; if (w.gear) w.hist = w.hist; return renderW(w);
    case 'hist': w.hist = !w.hist; return renderW(w);
    case 'expand': return expand(w);
    case 'collapse': return collapse(w);
    case 'xfit': return fitRect(bboxOf(w.ids), { max: 0.6 });
    case 'ungroup': return ungroup(w);
    case 'anchor': return anchorTo(w, b.dataset.id);
    case 'wmore': return wMoreMenu(w, b);
    case 'run': return runPlan(w, b.dataset.plan);
    case 'runmenu': return runMenu(w, b);
    case 'stop': return stopRun(w);
    case 'norun': return toast('В выделении нет рутины — запускать нечего');
    case 'share': return toast('В прототипе «Поделиться» не работает');
    case 'respick': if (w.comp.results.length > 1) resMenu(w, b); return;
    case 'rprev': case 'rnext': {
      const runs = resRuns(w, w.resTk); let i = w.resIdx == null ? runs.length - 1 : w.resIdx;
      i = Math.max(0, Math.min(runs.length - 1, i + (a === 'rnext' ? 1 : -1))); w.resIdx = i === runs.length - 1 ? null : i; return renderW(w);
    }
    case 'hgo': { const tk = b.dataset.tk, n = +b.dataset.n; const runs = resRuns(w, tk); const i = runs.findIndex((x) => x.r.n === n); if (w.comp.results.some((r) => r.tk === tk)) { w.resTk = tk; w.resIdx = i === runs.length - 1 ? null : i; } w.hist = false; return renderW(w); }
    case 'hgrp': w.hOpen[b.dataset.k] = !w.hOpen[b.dataset.k]; return renderW(w);
    case 'prompt': w.prOpen[b.dataset.k] = !w.prOpen[b.dataset.k]; return renderW(w);
    case 'bench': w.bench = !w.bench; w.changed = true; renderW(w); return toast(w.bench ? 'Сравнение с IMOEX включено' : 'Обзоры без сравнения с IMOEX');
    case 'tocard': w.toCard = !w.toCard; renderW(w); return toast(w.toCard ? 'Результат будет приходить отдельной карточкой на доску' : 'Результат — только в виджете');
    case 'repeat': return repeatMenu(w, b);
    case 'tkadd': return tickerMenu(w, b, 'add');
    case 'tkreplace': return tickerMenu(w, b, 'replace', b.dataset.tk);
    case 'tkrow': return tickerMenu(w, b, 'replace', b.dataset.tk);
    case 'tkdel': {
      e.stopPropagation(); const tk = b.dataset.tk; if (w.tick.length <= 1) return toast('Нужен хотя бы один тикер');
      w.tick = w.tick.filter((t) => t !== tk); w.changed = true; renderW(w); return toast(tk + ' убран · мини-обзор по нему не будет запускаться');
    }
    case 'nrun': { const n = N[b.dataset.id]; return toast('«' + n.title + '» запущена · в прототипе прогон показан в виджете'); }

});
grpBtn.addEventListener('click', () => group([...sel].filter((id) => N[id])));

// ---------- клавиатура ----------
const typing = (t) => t && (t.isContentEditable || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !typing(e.target)) { if (!spaceDown) { spaceDown = true; bd.classList.add('grab'); } e.preventDefault(); return; }
  if (typing(e.target) && e.key !== 'Escape') return;
  const mod = e.metaKey || e.ctrlKey;
  if (e.key === 'Escape') { if (!menuEl.hidden) return closeMenu(); const g = Object.values(Wd).find((x) => x.gear); if (g) { g.gear = false; return renderW(g); } return setSel([]); }
  if (busy) return;
  if (mod && (e.key === 'g' || e.key === 'G' || e.code === 'KeyG')) {
    e.preventDefault();
    if (e.shiftKey) { const w = [...sel].map((id) => Wd[id]).find(Boolean); if (w) ungroup(w); return; }
    return group([...sel].filter((id) => N[id]));
  }
  if (mod && (e.key === 'a' || e.code === 'KeyA')) { e.preventDefault(); selectAll(); return pulseGrp(); }
  if (!mod && e.key === '0') return animTo(Object.assign({}, PROD_VIEW));
  if (!mod && e.key === '1') return fitAll();
});
document.addEventListener('keyup', (e) => { if (e.code === 'Space') { spaceDown = false; bd.classList.remove('grab'); } });
function fitAll() { const ids = [...ORDER.filter(visible), ...Object.keys(Wd).filter(visible)]; fitRect(bboxOf(ids), { max: 1 }); }

// ---------- прочее ----------
const snack = $('#snack'); let snTm;
function toast(t, ok) { snack.innerHTML = (ok ? '<span class="ok">' + I('ok', 16) + '</span>' : '') + '<span>' + esc(t) + '</span>'; snack.classList.add('on'); clearTimeout(snTm); snTm = setTimeout(() => snack.classList.remove('on'), 3000); }
$('#vpnx').addEventListener('click', () => { $('#vpn').hidden = true; setTimeout(apply, 0); });
$('#share').addEventListener('click', () => toast('В прототипе «Поделиться» не работает'));
$$('[data-soon]').forEach((b) => b.addEventListener('click', () => toast('В прототипе открыта только доска «Начни утро с обзора рынка»')));
$$('.tbb').forEach((b) => b.addEventListener('click', () => { if (b.dataset.t !== 'select') toast('В прототипе работает только выделение'); }));
document.addEventListener('pointerdown', (e) => { if (!menuEl.hidden && !e.target.closest('.menu') && !e.target.closest('[data-act="runmenu"],[data-act="respick"],[data-act="tkadd"],[data-act="tkrow"],[data-act="tkreplace"],[data-act="wmore"],[data-act="repeat"]')) closeMenu(); }, true);
window.addEventListener('resize', apply);

buildNodes();
apply();
updateGrp();
window.__board = { view: (x, y, z) => { Object.assign(V, { x, y, z }); apply(); } };
})();
